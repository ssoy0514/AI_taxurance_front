<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <title>지원되지 않는 브라우저</title>
    <style>
      body {
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        height: 100vh;
        margin: 0;
        padding: 20px;
        background: #f8f8f8;
        color: #333;
        font-family: sans-serif;
        text-align: center;
        box-sizing: border-box;
      }
      .wrap {
        background: #fff;
        padding: 40px 60px;
        border-radius: 14px;
        box-shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
      }
      h1 {
        font-size: 22px;
        margin-bottom: 10px;
      }
      a {
        margin-top: 20px;
        display: inline-block;
        padding: 10px 20px;
        background: #1976d2;
        color: white;
        text-decoration: none;
        border-radius: 6px;
      }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1>이 브라우저는 지원되지 않습니다.</h1>
      <p>
        본 사이트는 최신 브라우저(Chrome, Edge, Firefox, Safari)에 최적화되어
        있습니다.
      </p>
      <a href="https://www.google.com/chrome/" target="_blank"
        >Chrome 다운로드</a
      >
    </div>
  </body>
</html>
