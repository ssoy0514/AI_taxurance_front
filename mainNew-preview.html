  <style>
    /* ── Reset ── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Noto Sans KR', 'Segoe UI', sans-serif; background: #f3f4f6; color: #101828; }
    a { text-decoration: none; color: inherit; }
    button { border: none; cursor: pointer; font-family: inherit; background: none; }
    em { font-style: normal; }
    ul { list-style: none; }
    img { display: block; }

    /* ── Layout ── */
    .cont-recommend { padding: 32px 0 40px; }
    .section { width: 100%; max-width: 740px; margin: 0 auto; padding: 0 30px; }
    .section + .section { margin-top: 36px; }

    /* ── Section Header ── */
    .section-header { display: flex; align-items: center; gap: 10px; margin-bottom: 16px; }
    .section-header h3 { font-size: 22px; font-weight: 800; color: #101828; }
    .section-badge { padding: 4px 10px; border-radius: 20px; font-size: 13px; font-weight: 700; color: #fff; }
    .badge-popular { background: #ff4d4f; }

    /* ── 퀵메뉴 ── */
    .quickmenu-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
    .qm-btn { display: flex; flex-direction: column; align-items: center; gap: 10px; padding: 18px 10px; border-radius: 16px; background: #fff; border: 1px solid #e4e7ec; box-shadow: 0 1px 6px rgba(0,0,0,.05); cursor: pointer; transition: box-shadow .2s, transform .2s; text-decoration: none; }
    .qm-btn:hover { box-shadow: 0 4px 16px rgba(0,0,0,.1); transform: translateY(-2px); }
    .qm-icon { display: flex; align-items: center; justify-content: center; width: 44px; height: 44px; border-radius: 12px; background: #eaf5ff; }
    .qm-icon svg { width: 22px; height: 22px; }
    .qm-btn span { font-size: 12px; font-weight: 600; color: #344054; text-align: center; line-height: 1.3; word-break: keep-all; }

    /* ── 메인카드리스트 ── */
    .card-list { display: flex; flex-direction: column; gap: 16px; }
    .card-item { display: flex; flex-direction: column; gap: 18px; padding: 24px 26px; border-radius: 20px; position: relative; box-shadow: 0 2px 12px rgba(0,0,0,.06), 0 1px 3px rgba(0,0,0,.04); overflow: hidden; }
    .card-header { display: flex; flex-direction: column; gap: 8px; }
    .card-tag { display: inline-block; padding: 4px 10px; border-radius: 20px; font-size: 12px; font-weight: 600; align-self: flex-start; }
    .card-tit { font-size: 24px; font-weight: 800; color: #101828; line-height: 1.3; }
    .card-tit em { display: block; -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .card-desc { font-size: 13px; color: #667085; }
    .card-media-group { display: flex; flex-direction: column; gap: 8px; }
    .card-media-label { display: flex; align-items: center; gap: 5px; font-size: 13px; font-weight: 600; color: #344054; }
    .card-media-list { display: flex; flex-direction: column; gap: 8px; }
    .card-link-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .card-link-btn { display: inline-flex; align-items: center; gap: 6px; padding: 9px 18px; border-radius: 10px; font-size: 13px; font-weight: 600; color: #fff; cursor: pointer; transition: opacity .2s; }
    .card-link-btn:hover { opacity: .85; }

    /* ── 테마 ── */
    .theme-product  { background: linear-gradient(135deg, #f0f7ff, #f8fbff); }
    .theme-product  .card-tag  { background: #dbeafe; color: #1d4ed8; }
    .theme-product  .card-tit em { background-image: linear-gradient(90deg, #1d4ed8, #60a5fa); }
    .theme-product  .card-link-btn { background: #2563eb; }

    .theme-live     { background: linear-gradient(135deg, #fff0f0, #fff7f7); }
    .theme-live     .card-tag  { background: #fee2e2; color: #b91c1c; }
    .theme-live     .card-tit em { background-image: linear-gradient(90deg, #dc2626, #f87171); }
    .theme-live     .card-link-btn { background: #ef4444; }

    .theme-service  { background: linear-gradient(135deg, #f0fdf8, #f7fffe); }
    .theme-service  .card-tag  { background: #ccfbf1; color: #0f766e; }
    .theme-service  .card-tit em { background-image: linear-gradient(90deg, #0d9488, #34d399); }
    .theme-service  .card-link-btn { background: #0f766e; }

    .theme-sales    { background: linear-gradient(135deg, #fff0f9, #fdf8ff); }
    .theme-sales    .card-tag  { background: #fce7f3; color: #be185d; }
    .theme-sales    .card-tit em { background-image: linear-gradient(90deg, #db2777, #f472b6); }
    .theme-sales    .card-link-btn { background: #db2777; }

    .theme-ai       { background: linear-gradient(135deg, #f6f3ff, #faf8ff); }
    .theme-ai       .card-tag  { background: #ede9fe; color: #6d28d9; }
    .theme-ai       .card-tit em { background-image: linear-gradient(90deg, #7c3aed, #a78bfa); }
    .theme-ai       .card-link-btn { background: #7c3aed; }

    .theme-speech   { background: linear-gradient(135deg, #fff7ed, #fffaf5); }
    .theme-speech   .card-tag  { background: #ffedd5; color: #c2410c; }
    .theme-speech   .card-tit em { background-image: linear-gradient(90deg, #ea580c, #fb923c); }
    .theme-speech   .card-link-btn { background: #ea580c; }

    .theme-story    { background: linear-gradient(135deg, #f0fdf4, #f7fff9); }
    .theme-story    .card-tag  { background: #dcfce7; color: #15803d; }
    .theme-story    .card-tit em { background-image: linear-gradient(90deg, #16a34a, #4ade80); }
    .theme-story    .card-link-btn { background: #16a34a; }

    .theme-needs    { background: linear-gradient(135deg, #fefce8, #fffef5); }
    .theme-needs    .card-tag  { background: #fef9c3; color: #b45309; }
    .theme-needs    .card-tit em { background-image: linear-gradient(90deg, #d97706, #fbbf24); }
    .theme-needs    .card-link-btn { background: #d97706; }

    .theme-default  { background: linear-gradient(135deg, #f5f3ff, #fdf4ff); }
    .theme-default  .card-tag  { background: #e9d5ff; color: #7e22ce; }
    .theme-default  .card-tit em { background-image: linear-gradient(90deg, #9333ea, #c084fc); }
    .theme-default  .card-link-btn { background: #9333ea; }

    /* ── Info Card (Video / Audio) ── */
    .info-card { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border: 1px solid #ddd; border-radius: 12px; background: #fff; cursor: pointer; }
    .info-card + .info-card { margin-top: 8px; }
    .info-thumb { flex-shrink: 0; position: relative; width: 60px; height: 60px; border-radius: 8px; background: #eee; overflow: hidden; }
    .info-thumb img { width: 100%; height: 100%; object-fit: cover; }
    .info-play-icon { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; color: #fff; background: rgba(0,0,0,.25); }
    .info-text { flex: 1; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
    .info-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .info-tag { padding: 1px 7px; border-radius: 4px; background: #f1f1f1; font-size: 11px; color: #555; }
    .info-title { font-size: 13px; font-weight: 600; color: #364153; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    .info-btm { display: flex; justify-content: space-between; align-items: center; }
    .info-time { font-size: 12px; color: #90a1b9; }
    .info-views { font-size: 12px; color: #364153; }

    /* ── 추천숏츠 (SectionRecommendVideo) ── */
    .rv-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
    .rv-card { display: flex; flex-direction: column; border-radius: 20px; overflow: hidden; background: #fff; box-shadow: 0 4px 24px rgba(0,0,0,.1); cursor: pointer; transition: transform .2s, box-shadow .2s; }
    .rv-card:hover { transform: translateY(-2px); box-shadow: 0 8px 32px rgba(0,0,0,.16); }
    .rv-thumb { position: relative; width: 100%; padding-top: 72%; background: #1a1a2e; overflow: hidden; }
    .rv-thumb img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .rv-overlay { position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,.5), transparent); display: flex; align-items: center; justify-content: center; opacity: 0; transition: opacity .2s; }
    .rv-card:hover .rv-overlay { opacity: 1; }
    .rv-play { width: 46px; height: 46px; border-radius: 50%; background: rgba(255,255,255,.9); display: flex; align-items: center; justify-content: center; font-size: 14px; color: #d14a6a; }
    .rv-dur { position: absolute; bottom: 10px; right: 10px; padding: 2px 7px; border-radius: 4px; background: rgba(0,0,0,.65); color: #fff; font-size: 11px; }
    .rv-body { padding: 13px 15px 15px; display: flex; flex-direction: column; gap: 5px; }
    .rv-tags { display: flex; gap: 4px; flex-wrap: wrap; }
    .rv-tag { padding: 2px 7px; border-radius: 4px; background: #f3eeff; color: #8b5cf6; font-size: 11px; font-weight: 600; }

    .rv-meta { display: flex; align-items: center; gap: 8px; margin-top: 2px; }
    .rv-views { font-size: 12px; color: #667085; font-weight: 500; }

    .pv-wrap { display: flex; flex-direction: column; gap: 12px; }

    .pv-title { font-size: 13px; font-weight: 600; color: #fff; line-height: 1.4; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
    .pv-views { font-size: 12px; color: #667085; }

    .pa-wrap { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .pa-card { display: flex; flex-direction: column; gap: 12px; padding: 18px 20px; border-radius: 16px; background: #101828; cursor: pointer; transition: background .2s; }
    .pa-card:hover { background: #1a2438; }
    .pa-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .pa-rank { font-size: 26px; font-weight: 900; line-height: 1; background: linear-gradient(135deg, #ff7c7e, #ae74ff); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
    .pa-tags { display: flex; gap: 4px; flex-wrap: wrap; justify-content: flex-end; }

    .pa-meta { display: flex; align-items: center; gap: 8px; }

    .pa-play { width: 32px; height: 32px; border-radius: 50%; background: rgba(174,116,255,.2); display: flex; align-items: center; justify-content: center; cursor: pointer; border: none; transition: background .2s; font-size: 12px; color: #c27aff; }
    .pa-play:hover { background: rgba(174,116,255,.4); }

    /* ── 고지 문구 ── */
    .txt-impor { max-width: 740px; margin: 0 auto; padding: 15px 30px; font-size: 12px; color: #98a2b3; line-height: 1.6; }

    @media (max-width: 600px) {
      .quickmenu-grid { grid-template-columns: repeat(2, 1fr); }
      .rv-wrap { grid-template-columns: 1fr; }
      .pa-wrap { grid-template-columns: 1fr; }
    }
  </style>
</head>

function fv(n) {
  if (!n) return 0
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M'
  if (n >= 1000) return (n / 1000).toFixed(1) + 'K'
  return n
}
function esc(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')
}

  play:  `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M5 3l8 5-8 5V3z" fill="currentColor"/></svg>`,
  eye:   `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M1 8s3-5 7-5 7 5 7 5-3 5-7 5-7-5-7-5z" stroke="currentColor" stroke-width="1.5"/><circle cx="8" cy="8" r="2" fill="currentColor"/></svg>`,
  clock: `<svg width="14" height="14" viewBox="0 0 14 14" fill="none"><circle cx="7" cy="7" r="6" stroke="currentColor" stroke-width="1.5"/><path d="M7 4v3.5l2 2" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  arrow: `<svg width="16" height="16" viewBox="0 0 16 16" fill="none"><path d="M3 8h10M9 4l4 4-4 4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>`,
  wave:  `<svg width="36" height="36" viewBox="0 0 36 36" fill="none"><rect width="36" height="36" rx="18" fill="#7c3aed" fill-opacity="0.12"/><path d="M12 14v8M15 11v14M18 13v10M21 11v14M24 14v8" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/></svg>`,
  prdinfo:`<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><circle cx="11" cy="11" r="9" stroke="#344054" stroke-width="1.5"/><path d="M11 7v5M11 14v1" stroke="#344054" stroke-width="2" stroke-linecap="round"/></svg>`,
  bible: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><rect x="3" y="3" width="16" height="16" rx="2" stroke="#344054" stroke-width="1.5"/><path d="M7 8h8M7 11h8M7 14h5" stroke="#344054" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  under: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M11 3v9m0 0l-3-3m3 3l3-3" stroke="#344054" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 16h14" stroke="#344054" stroke-width="1.5" stroke-linecap="round"/><path d="M4 19h14" stroke="#344054" stroke-width="1.5" stroke-linecap="round"/></svg>`,
  terms: `<svg width="22" height="22" viewBox="0 0 22 22" fill="none"><path d="M6 3h10a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z" stroke="#344054" stroke-width="1.5"/><path d="M8 8h6M8 11h6M8 14h4" stroke="#344054" stroke-width="1.5" stroke-linecap="round"/></svg>`,
}

/* ================================================================
 * 렌더링 함수
 * ================================================================ */

function renderSection(title, content, badge) {
  const badgeHtml = badge ? `<span class="section-badge badge-popular">${esc(badge)}</span>` : ''
  return `
    <div class="section">
      <div class="section-header"><h3>${esc(title)}</h3>${badgeHtml}</div>
      ${content}
    </div>`
}

function renderQuickMenu() {
  const menus = [
    { label:'상품나침반',     icon: SVG.prdinfo, href:'/sales/product-info' },
    { label:'보장설계 바이블', icon: SVG.bible,   href:'/sales/design-bible' },
    { label:'간편 언더라이팅', icon: SVG.under,   href:'/sales/under' },
    { label:'약관조회',       icon: SVG.terms,   href:'/sales/terms' },
  ]
  const btns = menus.map(m => `
    <a href="${m.href}" class="qm-btn">
      <span class="qm-icon">${m.icon}</span>
      <span>${esc(m.label)}</span>
    </a>`).join('')
  return `<div class="section"><div class="quickmenu-grid">${btns}</div></div>`
}

function renderInfoCard(item, type) {
  const thumb = item.thumbnail
    ? `<img src="${esc(item.thumbnail)}" alt="" loading="lazy" />`
    : ''
  const tags = (item.tags||[]).map(t => `<span class="info-tag">${esc(t)}</span>`).join('')
  return `
    <div class="info-card">
      <div class="info-thumb">${thumb}<div class="info-play-icon">${SVG.play}</div></div>
      <div class="info-text">
        <div class="info-tags">${tags}</div>
        <p class="info-title">${esc(item.title)}</p>
        <div class="info-btm">
          <span class="info-time">${SVG.clock} ${esc(item.duration)}</span>
          <span class="info-views">${SVG.eye} ${fv(item.views)}</span>
        </div>
      </div>
    </div>`
}

function renderCardList() {
  const cards = CARD_DATA.map(card => {
    const theme = getTheme(card.top_tag)
    const desc = card.desc ? `<p class="card-desc">${esc(card.desc)}</p>` : ''
    const videos = card.videos && card.videos.length
      ? `<div class="card-media-group">
           <p class="card-media-label">${SVG.play} 숏츠</p>
           <div class="card-media-list">${card.videos.map(v => renderInfoCard(v,'video')).join('')}</div>
         </div>` : ''
    const audios = card.audios && card.audios.length
      ? `<div class="card-media-group">
           <p class="card-media-label">${SVG.play} 팟캐스트</p>
           <div class="card-media-list">${card.audios.map(a => renderInfoCard(a,'audio')).join('')}</div>
         </div>` : ''
    const links = card.links && card.links.length
      ? `<div class="card-link-group">${card.links.map(l =>
          `<a href="${LINK_TYPE_MAP[l.link_type]||'#'}" class="card-link-btn">${esc(l.name)} ${SVG.arrow}</a>`
        ).join('')}</div>` : ''
    return `
      <div class="card-item theme-${theme}">
        <div class="card-header">
          <span class="card-tag">${esc(card.top_tag)}</span>
          <p class="card-tit">${esc(card.top_text)}<em>${esc(card.bottom_text)}</em></p>
          ${desc}
        </div>
        ${videos}${audios}${links}
      </div>`
  }).join('')
  return `<div class="section"><div class="card-list">${cards}</div></div>`
}

function renderRecommendVideo(items) {
  const cards = items.map(item => `
    <div class="rv-card">
      <div class="rv-thumb">
        ${item.thumbnail ? `<img src="${esc(item.thumbnail)}" alt="" loading="lazy" />` : ''}
        <div class="rv-overlay"><div class="rv-play">${SVG.play}</div></div>
        <span class="rv-dur">${esc(item.duration)}</span>
      </div>
      <div class="rv-body">
        <div class="rv-tags">${(item.tags||[]).map(t=>`<span class="rv-tag">${esc(t)}</span>`).join('')}</div>
        <p class="rv-title">${esc(item.title)}</p>
        <div class="rv-meta"><span class="rv-views">${SVG.eye} ${fv(item.views)}</span></div>
      </div>
    </div>`).join('')
  return renderSection('지금 뜨는 숏츠', `<div class="rv-wrap">${cards}</div>`)
}

function renderRecommendAudio(items) {
  const cards = items.map(item => `
    <div class="ra-card">
      <div class="ra-icon">${SVG.wave}</div>
      <div class="ra-content">
        <div class="ra-tags">${(item.tags||[]).map(t=>`<span class="ra-tag">${esc(t)}</span>`).join('')}</div>
        <p class="ra-title">${esc(item.title)}</p>
        <div class="ra-meta">
          <span class="ra-dur">${SVG.clock} ${esc(item.duration)}</span>
          <span class="ra-views">${SVG.eye} ${fv(item.views)}</span>
        </div>
      </div>
      <button class="ra-play">${SVG.play} 듣기</button>
    </div>`).join('')
  return renderSection('지금 바로 들어봐요', `<div class="ra-wrap">${cards}</div>`)
}

function renderPopularVideo(items) {
  const cards = items.map((item, idx) => `
    <div class="pv-card">
      <span class="pv-rank">${String(idx+1).padStart(2,'0')}</span>
      <div class="pv-thumb">
        ${item.thumbnail ? `<img src="${esc(item.thumbnail)}" alt="" loading="lazy" />` : ''}
        <div class="pv-thumb-play">${SVG.play}</div>
        <span class="pv-dur">${esc(item.duration)}</span>
      </div>
      <div class="pv-info">
        <div class="pv-tags">${(item.tags||[]).map(t=>`<span class="pv-tag">${esc(t)}</span>`).join('')}</div>
        <p class="pv-title">${esc(item.title)}</p>
        <div class="pv-meta"><span class="pv-views">${SVG.eye} ${fv(item.views)}</span></div>
      </div>
    </div>`).join('')
  return renderSection('인기숏츠', `<div class="pv-wrap">${cards}</div>`, 'HOT')
}

function renderPopularAudio(items) {
  const cards = items.map((item, idx) => `
    <div class="pa-card">
      <div class="pa-top">
        <span class="pa-rank">${String(idx+1).padStart(2,'0')}</span>
        <div class="pa-tags">${(item.tags||[]).map(t=>`<span class="pa-tag">${esc(t)}</span>`).join('')}</div>
      </div>
      <p class="pa-title">${esc(item.title)}</p>
      <div class="pa-bottom">
        <div class="pa-meta">
          <span class="pa-dur">${SVG.clock} ${esc(item.duration)}</span>
          <span class="pa-views">${SVG.eye} ${fv(item.views)}</span>
        </div>
        <button class="pa-play">${SVG.play}</button>
      </div>
    </div>`).join('')
  return renderSection('인기팟캐스트', `<div class="pa-wrap">${cards}</div>`, 'HOT')
}

/* ================================================================
 * 초기화
 * ================================================================ */
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('app').innerHTML = [
    renderQuickMenu(),
    renderCardList(),
    renderRecommendVideo(SCORE_VIDEOS),
    renderRecommendAudio(SCORE_AUDIOS),
    renderPopularVideo(RANK_VIDEOS),
    renderPopularAudio(RANK_AUDIOS),
    `<p class="txt-impor">※ 본 시스템에서 제공되는 콘텐츠는 AI를 기반으로 생성, 제작되었으니 자세한 내용은 관련 지침과 자료를 확인하시기 바라며, 교육용 자료로 고객에게 제시/교부하거나 온라인 게시·전송할 수 없습니다.</p>`,
  ].join('\n')
})
</script>
</body>
</html>
